<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurador 3D - Showcase Premium</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; display: flex; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #000; color: #fff; overflow: hidden; }
        
        /* O 3D agora ocupa 100% da tela como fundo */
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        
        /* Painel translúcido flutuante (Glassmorphism) */
        #ui-layer { 
            position: absolute; top: 20px; left: 20px; width: 420px; height: calc(100vh - 40px); 
            z-index: 10; background: rgba(15, 16, 20, 0.4); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 30px; 
            display: flex; flex-direction: column; gap: 20px; overflow-y: auto;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }
        
        /* Scrollbar invisível/elegante */
        #ui-layer::-webkit-scrollbar { width: 4px; }
        #ui-layer::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

        h1 { font-size: 1.8em; margin: 0; font-weight: 300; letter-spacing: 2px; }
        h1 span { font-weight: 800; color: #00e5ff; }

        .category-block { display: flex; flex-direction: column; gap: 12px; }
        .cat-title { font-size: 0.9em; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #8892b0; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 5px; }
        
        .product-list { display: flex; flex-direction: column; gap: 8px; }
        .product-card { 
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px 15px; border-radius: 10px; cursor: pointer; transition: all 0.3s ease;
        }
        .product-card:hover { background: rgba(255, 255, 255, 0.08); transform: translateX(5px); }
        .product-card.selected { 
            background: rgba(0, 229, 255, 0.1); border-color: #00e5ff; 
            box-shadow: inset 0 0 15px rgba(0, 229, 255, 0.1);
        }
        
        .prod-name { font-size: 0.9em; font-weight: 500; }
        .prod-specs { font-size: 0.75em; color: #00e5ff; font-weight: bold; }

        /* Loader */
        #loading-indicator { 
            display: none; position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); color: #fff; padding: 12px 25px; 
            border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); font-size: 0.9em; z-index: 20;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
        }
        .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #00e5ff; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <!-- NOVO: Gerador de iluminação realista -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
</head>
<body>

<div id="ui-layer">
    <h1>PC <span>SHOWCASE</span></h1>
    <div id="controls-container"></div>
</div>

<div id="canvas-container"></div>
<div id="loading-indicator"><div class="spinner"></div> Renderizando componentes...</div>

<script src="script.js"></script>

</body>
</html>
